# The packages list specifies all the packages that you
# require installed.  <#> will ensure that all packages
# and their dependencies are installed when you build this
# profile.

packages:
  curl:
    use: host-curl
  py2gmsh:
  future:
  cmake:
    use: host-cmake
  openjpeg: #dependency of chrono
    version: '2.5'
  openssl:
    use: host-openssl
  sqlite:
  python:
    host: false
    link: shared
    build_with: |
      bzip2, sqlite, openssl, ncurses
  blas:
    use: openblas
  lapack:
    use: openblas-lapack
  #daetk:
  #  petscversion: 3.21.1
  mpi:
    use: host-mpi
  mpi4py:
  hdf5:
  petsc:
    version: 3.21.2
    openblas: true
    build_with: |
      cmake, blas
    download: |
      superlu, superlu_dist, hypre, blacs, scalapack, mumps, zoltan, parmetis, metis, zoltan
    coptflags: -O2
    link: shared
    debug: false
  petsc4py:
    version: 3.21.2
  tetgen:
  triangle:
  memory_profiler:
  #scipy:
  h5py:
  pip:
  chrono:
  gmsh:
  scorec:
  xtensor:
  xtensor-python:
