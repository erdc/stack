extends: [setuptools_package]

dependencies:
  build: [pip, blas, lapack, numpy, pybind11, pybind11_cmake, cython, ninja, pythran, meson, gast, beniget, ply, {{build_with}}]
  run: [blas, lapack, numpy, pybind11, pybind11_cmake, cython, ninja, pythran, meson, gast, beniget, ply]

sources:
- key: tar.gz:hthrylnihwqjlj24pnc7mzmnvliozgyg
  url: https://github.com/scipy/scipy/archive/refs/tags/v1.13.0.tar.gz

build_stages:
- name: create-site.cfg
  after: prologue
  before: install
  handler: bash
  bash: |
    cat > site.cfg << EOF
    [ALL]
    extra_link_args = -shared
    [openblas]
    libraries = openblas
    library_dirs = ${OPENBLAS_DIR}/lib
    include_dirs = ${OPENBLAS_DIR}/include
    runtime_library_dirs = ${OPENBLAS_DIR}/lib
    EOF
- name: set-LDFLAGS
  after: prologue
  before: install
  handler: bash
  bash: |
    export NPY_DISTUTILS_APPEND_FLAGS=1
    export CPPFLAGS="${CPPFLAGS} -I$(${PYTHON} -c "import numpy; print(numpy.get_include())") -I${PYBIND11_CMAKE_DIR}/include"
    echo $CPPFLAGS
    export LDFLAGS="-shared -Wl,-rpath=${PYTHON_DIR}/lib -Wl,-rpath=${OPENBLAS_DIR}/lib $(${PYTHON_DIR}/bin/python3-config --ldflags)"
#    export LAPACK=None
#    export BLAS=None
- name: install
  after: setup_dirs
  mode: replace
  handler: bash
  bash: |
    PATH=$MESON_DIR/bin:$CYTHON_DIR/bin:$PYTHRAN_DIR/bin:$PATH PYTHONPATH=$PYTHONPATH:$SETUPTOOLS_DIR/lib/python{{pyver}}/site-packages ${PIP_DIR}/bin/pip \
       ${SETUPTOOLS_PACKAGE_EXTRA_OPTIONS} \
       install \
       --prefix=. --root=${ARTIFACT} .
