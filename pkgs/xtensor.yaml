extends: [cmake_package]

dependencies:
  build: [xtl, mpi]
  run: [xtl, mpi]

sources:
- key: tar.gz:glk5t7jdtggfpz2gyn22krhn6vclotyk
  url: https://github.com/xtensor-stack/xtensor/archive/refs/tags/0.25.0.tar.gz

defaults:
  relocatable: true

build_stages:
- name: setup_builddir
  after: prologue
  handler: bash
  bash: |
    mkdir -p _build
    cd _build

- name: configure
  debug: true
  extra: [
  '-DCMAKE_C_COMPILER:STRING=gcc',
  '-DCMAKE_CXX_COMPILER:STRING=g++',
  # '-DXTENSOR_USE_XSIMD:INT=0',
  ]
