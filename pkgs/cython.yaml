extends: [setuptools_package]

dependencies:
  build: []
  run: []

sources:
- key: tar.gz:ad4xi5wo7h6ntke7tuvetpr3kghbu5fz
  url: https://github.com/cython/cython/archive/refs/tags/3.0.10.tar.gz

when_build_dependency:
  - prepend_path: PATH
    value: ${ARTIFACT}/bin
  - prepend_path: PYTHONPATH
    value: '${ARTIFACT}/lib/python{{pyver}}/site-packages'
