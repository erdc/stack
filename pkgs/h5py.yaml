extends: [setuptools_package]

dependencies:
  build: [hdf5, mpi4py, mpi, numpy, cython, pkgconfig, six]
  run: [numpy, mpi4py, pkgconfig, cython]

sources:
- key: tar.gz:pn7i66ahfixn5sd4ta3pexzuea75jeve
  url: https://files.pythonhosted.org/packages/52/8f/e557819155a282da36fb21f8de4730cfd10a964b52b3ae8d20157ac1c668/h5py-3.11.0.tar.gz

build_stages:
- name: install
  after: setup_dirs
  mode: replace
  handler: bash
  bash: |
       HDF5_VERSION=1.14.4 HDF5_MPI="ON"  \
       CC=${MPICC} CXX=${MPICXX} ${PYTHON} -c 'import setuptools; __file__="setup.py"; exec(open(__file__).read())' \
       ${SETUPTOOLS_PACKAGE_EXTRA_OPTIONS} \
       install \
       --prefix=. --root=${ARTIFACT} \
       --single-version-externally-managed

